# Checks every push to main and every pull request. Cloudflare deploys main on its own;
# this catches a broken build, a type error or unformatted code before (or as) it ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Also validates every UI Kit snippet: a bad one fails the build.
      - name: Build
        run: npm run build
