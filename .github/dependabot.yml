# Weekly dependency updates as pull requests. CI runs on each one; merging to main deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor and patch updates.
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions arrive one PR each, so breaking changes are reviewed on their own.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
